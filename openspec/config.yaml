schema: spec-driven

context: |
  AI Cowork Game is a single-user platform for creating multiple isolated Projects from an idea,
  confirmed GDD, and validated provider-neutral CreatorGameSpec. The approved
  docs/product/AI_COWORK_GAME_V1_DESIGN_SPEC.md is the highest product authority. V1 produces
  validated Phaser 2D browser-playable artifacts through a replaceable Agent Runtime.
  Frontend: Vue 3 + TypeScript + Vite + Monaco. Backend: Python 3.11+ + FastAPI + SQLite.
  FastAPI owns the deterministic business workflow and all human/publish gates.
  Platform V1 uses one provider-neutral Agent Runtime contract with Game Design, GameSpec and Game
  Build profiles. OpenGameAdapter is the first real Build provider and benchmark; Claude SDK and
  Pi Agent may implement the same contract without changing lifecycle semantics. Verification is
  platform-owned, not an Agent. Runtime execution uses isolated project workspaces and task-scoped
  context. Changes produce BuildCandidates; only platform Verification plus Human Play Review makes
  a Candidate eligible for explicit Human Promote into an immutable Git-backed PlayableVersion. A separate
  explicit Human Publish creates an immutable Release, whose extracted ResourceCandidates require
  Resource Review before becoming global SavedResources. Failed Candidates never replace the
  current PlayableVersion or an existing Release.

rules:
  proposal:
    - State which V1 wave owns the change and list its dependencies.
    - Treat both Design Spec P0 and P1 as mandatory V1 scope; wave ordering is not deferral.
  specs:
    - Use SHALL for normative requirements and include Given/When/Then scenarios.
    - Keep FastAPI as the sole owner of Confirm GDD, Confirm GameSpec, Blocking Build Decision, Candidate/Test verdict acceptance, Human Play Review/Promote, Publish Review, and Resource Review save/ignore decisions.
    - Keep CreatorGameSpec provider-neutral and keep runtime/provider commands, paths, ids, and UI workflow state out of it.
  design:
    - Document trust boundaries, runtime adapter boundaries, failure behavior, and Candidate/TestReport/Version semantics.
  tasks:
    - Order work as vertical slices and put contract tests before provider-specific integration.
    - Keep provider-specific adapter work separate from shared V1 Agent Runtime profile contracts.

operations:
  apply:
    guidance:
      - Do not let provider integration redefine the shared V1 profiles, task-scoped context, verification or Human Gates.
      - Never let an Agent or provider-native event directly mutate platform business state.
  archive:
    guidance:
      - Archive V1 only after both Wave 1 and Wave 2 acceptance, including resource-assisted Build Context and Release distribution.
