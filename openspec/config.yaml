schema: spec-driven

context: |
  AI Cowork Game is a single-user platform for creating multiple isolated Projects from an idea,
  confirmed Game Design, and validated provider-neutral CreatorGameSpec. V1 produces validated
  browser-playable artifacts through a selected runtime; OpenGameAdapter is the first V1 runtime
  implementation, not the product-level game vocabulary.
  Frontend: Vue 3 + TypeScript + Vite + Monaco. Backend: Python 3.11+ + FastAPI + SQLite.
  FastAPI owns the deterministic business workflow and all human/publish gates.
  Platform V1 uses OpenGameAdapter as the first GameAgent Runtime and benchmark baseline. Runtime
  capability limits are adapter evidence and must not silently redefine CreatorGameSpec.
  Platform V2 must use Claude Agent SDK with PlanningAgent, AssetAgent, CodingAgent, and TestAgent.
  OpenGame remains a fallback/reference backend in V2. Agent profiles are controlled sessions,
  not autonomous microservices. Runtime execution uses isolated project workspaces.
  Changes produce BuildCandidates; only build success plus a validated PASS TestReport makes a
  Candidate eligible for explicit Human Promote into an immutable PlayableVersion. A separate
  explicit Human Publish creates an immutable Release, whose extracted ResourceCandidates require
  Resource Review before becoming global SavedResources. Failed Candidates never replace the
  current PlayableVersion or an existing Release.

rules:
  proposal:
    - State whether the change belongs to Platform V1 or Platform V2.
    - Include explicit non-goals and dependency on the other roadmap phase when applicable.
  specs:
    - Use SHALL for normative requirements and include Given/When/Then scenarios.
    - Keep FastAPI as the sole owner of GDD Confirm, GameSpec Confirm, Candidate/Test verdict acceptance, Human Promote, Human Publish, and Resource Review save/ignore decisions.
    - Keep CreatorGameSpec provider-neutral and keep runtime/provider commands, paths, ids, and UI workflow state out of it.
  design:
    - Document trust boundaries, runtime adapter boundaries, failure behavior, and Candidate/TestReport/Version semantics.
  tasks:
    - Order work as vertical slices and put contract tests before provider-specific integration.
    - Keep V1 baseline tasks separate from V2 Claude Runtime tasks.

operations:
  apply:
    guidance:
      - Do not start V2 provider integration until V1 shared contracts and release gate are verified.
      - Never let an Agent or provider-native event directly mutate platform business state.
  archive:
    guidance:
      - Archive V1 before V2 because V2 depends on the V1 runtime and candidate/version contracts.
