[project]
name = "ai-cowork-game-api"
version = "0.1.0"
description = "AI Cowork Game platform backend foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "alembic>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "dulwich>=0.21,<1",
  "playwright>=1.62.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
